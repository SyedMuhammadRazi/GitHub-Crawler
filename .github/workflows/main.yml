name: GitHub Crawler

on:
  push:
    branches: [main]

jobs:
  crawl-stars:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: GithubCrawler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: GithubCrawler
      DB_USER: postgres
      DB_PASSWORD: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests python-dotenv

      - name: Create database tables
        run: |
          python src/crawler/db.py

      - name: Run GitHub crawler
        run: |
          python src/crawler/crawler.py

      - name: Dump repositories table to CSV
        run: |
          pip install pandas psycopg2-binary
          python src/crawler/to_csv.py

      - name: Upload repositories CSV as artifact
        uses: actions/upload-artifact@v3
        with:
          name: repositories-data
          path: repositories.csv
